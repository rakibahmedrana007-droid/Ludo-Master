<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ludo Master</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}.app{max-width:480px;margin:auto;min-height:100vh;background:#fff}header{background:#673ab7;color:#fff;padding:20px;text-align:center}header h1{margin:0 0 8px}nav{display:flex;gap:8px;padding:12px;overflow:auto;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff;z-index:5}nav button{border:0;background:#eee;padding:10px 14px;border-radius:20px;white-space:nowrap;font-weight:600}main{padding:15px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}.balance{font-size:28px;font-weight:bold}.action{width:100%;padding:13px;border:0;border-radius:10px;background:#673ab7;color:#fff;font-size:16px;margin-top:8px}.small{color:#777;font-size:13px}.input{width:100%;padding:12px;margin-top:6px;border:1px solid #ddd;border-radius:10px}.payment-methods{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.pay-card{background:#fff;border:2px solid #eee;border-radius:16px;padding:14px;text-align:center;cursor:pointer;box-shadow:0 3px 12px #0001}.pay-card img{width:100%;height:70px;object-fit:contain;border-radius:10px}.payment-number-box{margin:12px 0;padding:16px;border-radius:16px;background:#f7f7f7;text-align:center;border:1px solid #ddd}.payment-number-box #payment-number{font-size:24px;font-weight:800;letter-spacing:1px;margin:8px 0 12px}.payment-number-box button{border:0;border-radius:10px;padding:10px 16px;background:#222;color:#fff;font-weight:700}.yellow{background:#FFD600;color:#111;font-weight:bold}.disabled{opacity:.55}.room{font-size:28px;font-weight:800;text-align:center;margin:10px}.ok{color:#16803c;font-weight:700}.warn{color:#a05a00;font-weight:700}
</style></head>
<body><div class="app">
<header><h1>🎲 Ludo Master</h1><div>🥰 লুডু মাস্টার App সাগতম 🥰</div></header>
<nav><button onclick="show('home')">Home</button><button onclick="show('matches')">🎮 Matches</button><button onclick="show('tournament')">Tournament</button><button onclick="show('wallet')">Wallet / Deposit</button><button onclick="show('profile')">Profile</button><button onclick="show('admin')">🔐 Admin</button></nav>
<main id="content"></main></div>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script src="app.js"></script></body></html>
