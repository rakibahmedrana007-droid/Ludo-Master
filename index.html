<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludo Master</title><style>
body{margin:0;font-family:Arial;background:#08783b;color:#fff}header{background:#075b2e;padding:18px;text-align:center}nav{display:flex;gap:6px;padding:10px;background:#064c26;overflow:auto}button{border:0;border-radius:8px;padding:11px;font-weight:bold}nav button{white-space:nowrap}.page{max-width:600px;margin:auto;padding:15px}.card{background:#fff;color:#222;border-radius:14px;padding:18px;margin:12px 0}input{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}.pay{display:flex;gap:10px}.pay button{flex:1;background:#fff;border:2px solid #ddd}.pay .active{border-color:#08783b;background:#eafff1}.num{font-size:22px;font-weight:bold;margin:10px 0}.mainbtn{width:100%;background:#08783b;color:#fff;font-size:16px}.hidden{display:none}.ok{color:#08783b;font-weight:bold}</style></head><body>
<header><h2>🥰 লুডু মাস্টার App সাগতম 🥰</h2></header>
<nav><button onclick="show('home')">Home</button><button onclick="show('matches')">🎮 Matches</button><button onclick="show('deposit')">💰 Deposit</button><button onclick="show('profile')">👤 Profile</button><button onclick="show('admin')">🔐 Admin</button></nav>
<section id="home" class="page"><div class="card"><h3>Welcome</h3><p>লুডু মাস্টারে স্বাগতম।</p></div></section>
<section id="matches" class="page hidden"><div class="card"><h3>🎮 Matches</h3><p>Matches এখানে থাকবে।</p></div></section>
<section id="deposit" class="page hidden"><div class="card"><h3>💰 Deposit</h3><p>Payment method নির্বাচন করুন:</p><div class="pay"><button id="bk" onclick="pay('bkash')">🟣 bKash</button><button id="ng" onclick="pay('nagad')">🟠 Nagad</button></div><div id="info" class="hidden"><p id="label"></p><div id="num" class="num"></div><button onclick="copyNum()">📋 Copy Number</button></div><label>Deposit Amount (৳)</label><input id="amount" type="number" placeholder="যেমন 100"><label>Transaction ID</label><input id="trx" placeholder="Transaction ID লিখুন"><button class="mainbtn" onclick="submitDeposit()">Deposit Submit</button><p id="msg"></p><small>Screenshot লাগবে না।</small></div></section>
<section id="profile" class="page hidden"><div class="card"><h3>👤 Profile</h3></div></section>
<section id="admin" class="page hidden"><div class="card"><h3>🔐 Admin Login</h3><input id="key" type="password" placeholder="Admin Login Key"><button class="mainbtn" onclick="login()">Login</button><p id="am"></p></div><div id="panel" class="card hidden"><h3>Deposit Requests</h3><div id="requests"></div></div></section>
<script src="app.js"></script></body></html>
